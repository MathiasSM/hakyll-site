# OpenSSF Scorecard: security posture for the repository.
name: OpenSSF Scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 2 * * 0" # weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to publish results to the Scorecard API and upload SARIF.
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run analysis
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
