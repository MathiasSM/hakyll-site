name: Build & Test (reusable)

on:
  workflow_call:
    inputs:
      ghc-version:
        description: "GHC version to use"
        type: string
        required: true
      cabal-version:
        description: "cabal-install version to use"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Cabal
    runs-on: ubuntu-latest
    steps:
      # ======================================================== Setup
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: ${{ inputs.ghc-version }}
          cabal-version: ${{ inputs.cabal-version }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          cabal install hpc-codecov

      # ======================================================== Build
      - name: Configure the build
        run: |
          cabal configure \
            --enable-tests --enable-coverage \
            --enable-benchmarks --disable-documentation
          cabal build all --dry-run

      - name: Restore cached dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-cabal
        env:
          key: ${{ runner.os }}-ghc-${{ inputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-nodocs-tests-bench-coverage
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-${{ hashFiles('cabal.project', 'cabal.project.freeze', 'mathiassm.cabal') }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        if: ${{ steps.cache-cabal.outputs.cache-hit != 'true' }}
        # If we had an exact cache hit, the dependencies will be up to date.
        run: cabal build all --only-dependencies

      - name: Build
        run: |
          cabal build all
          cp "$(cabal list-bin exe:site)" artifact-executable

      - name: Upload executable as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifact-executable
          name: artifact-executable

      # ======================================================== Tests
      - name: Run tests
        run: cabal test test

      - name: Transform coverage file
        run: hpc-codecov cabal:test -f cobertura -o cobertura.xml

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: cobertura.xml
          name: artifact-coverage

      # ======================================================== Documentation
      - name: Build documentation
        run: |
          cabal haddock-project --hackage --all \
            --haddock-options="--show-all" \
            --haddock-options="--quickjump"
      - name: Upload documentation as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: haddocks
          name: artifact-docs
