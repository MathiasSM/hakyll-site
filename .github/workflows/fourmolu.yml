# Reusable format job: checks Haskell sources are fourmolu-formatted.
name: Format (reusable)

on:
  workflow_call:
    inputs:
      fourmolu-version:
        description: "fourmolu version to use"
        type: string
        required: true

permissions:
  contents: read

jobs:
  format:
    name: Fourmolu
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Verify required inputs are set
        shell: bash
        run: |
          fail=0
          [ -n "${{ inputs.fourmolu-version }}" ] || { echo "::error::fourmolu-version is empty"; fail=1; }
          exit $fail

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: haskell-actions/run-fourmolu@1b9df64b784203126500372730b9725c97e4040b # v13
        with:
          version: ${{ inputs.fourmolu-version }}
          pattern: |
            **.hs
