# Verify and test the site generator.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  code-quality: write
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    uses: ./.github/workflows/hlint.yml
    permissions:
      security-events: write
      contents: read

  format:
    uses: ./.github/workflows/fourmolu.yml
    with:
      fourmolu-version: ${{ vars.FOURMOLU_VERSION }}

  build:
    uses: ./.github/workflows/build-test.yml
    with:
      ghc-version: ${{ vars.GHC_VERSION }}
      cabal-version: ${{ vars.CABAL_VERSION }}

  upload-coverage:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-coverage
      - name: Upload coverage report
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          fail-on-error: false # TODO: Fix failing runs
          file: cobertura.xml
          language: Haskell
          label: code-coverage/cabal

  changelog-gate:
    name: Verify version in Changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a changelog entry for version bumps
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          old_version="$(git show "$BASE:mathiassm.cabal" | awk '/^version:/{print $2}')"
          new_version="$(awk '/^version:/{print $2}' mathiassm.cabal)"

          if [ "$old_version" = "$new_version" ]; then
            echo "Version unchanged ($new_version); no changelog entry required."
            exit 0
          fi

          if grep -Fq "[$new_version]" CHANGELOG.md; then
            echo "CHANGELOG.md has an entry for $new_version."
          else
            echo "::error::Version bumped to $new_version but CHANGELOG.md has no [$new_version] entry."
            exit 1
          fi
