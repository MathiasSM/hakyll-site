# Weekly check for outdated Haskell dependencies.
name: Outdated dependencies

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 5 * * 1" # Mondays at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  outdated:
    name: Check for outdated dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ vars.GHC_VERSION }}
          cabal-version: ${{ vars.CABAL_VERSION }}

      - name: 'Dependency Review'
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          # Block only high/critical vulnerabilities. Note: this action reviews
          # the GitHub Actions dependencies, not the Haskell/Cabal ones.
          fail-on-severity: high
          # Only comment on the PR when there is something to report.
          comment-summary-in-pr: on-failure
          retry-on-snapshot-warnings: true
          show-patched-versions: true

      - name: Cabal outdated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cabal update
          set +e
          cabal outdated --exit-code > outdated.txt 2>&1
          HAS_OUTDATED=$?
          set -e
          cat outdated.txt

          TITLE="Outdated Cabal dependencies"
          LABEL="automation/outdated"

          gh label create "$LABEL" --color "D93F0B" 2>/dev/null || true

          ISSUE=$(gh issue list --label "$LABEL" --app github-actions \
            --state all --json number --jq '.[0].number')

          if [ "$HAS_OUTDATED" -ne 0 ]; then
            if [ -z "$ISSUE" ]; then
              gh issue create --title "$TITLE" \
                --label "$LABEL" \
                --body "$(cat outdated.txt)"
            else
              gh issue reopen "$ISSUE" 2>/dev/null || true
              gh issue edit "$ISSUE" --body "$(cat outdated.txt)"
            fi
          elif [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE"
          fi
