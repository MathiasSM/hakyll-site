name: PR Checks

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run that may be publishing the site
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  GHC_VERSION: "9.10.3"
  CABAL_VERSION: "3.14"
  FOURMOLU_VERSION: "0.20.1.0"
  HLINT_VERSION: "3.10"

  DEPENDENCIES: |
    imagemagick

jobs:

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Set up HLint
        uses: haskell-actions/hlint-setup@v2
        with:
          version: ${{ env.HLINT_VERSION }}

      - uses: actions/checkout@v3

      - name: 'Run HLint'
        uses: haskell-actions/hlint-run@v2
        with:
          path: src/
          fail-on: warning

      - uses: haskell-actions/run-fourmolu@v13
        with:
          version: "${{ env.FOURMOLU_VERSION }}"
          pattern: |
            src/**.hs
            app/**.hs
            test/**.hs

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $DEPENDENCIES

      - name: Plan the build
        run: |
          cabal update
          cabal build all --dry-run
          
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site/
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: [build, lint]
    if: github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $DEPENDENCIES

      - name: Get the content
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CONTENT_REPOSITORY }}
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: content

      - name: Build the site
        run: |
          cabal run site -- build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

        

