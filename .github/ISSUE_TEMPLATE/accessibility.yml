name: Accessibility Issue
description: Report an accessibility barrier or bug.
title: "[a11y]: "
labels:
  - TRIAGE
  - "type: accessibility"
assignees:
  - MathiasSM
body:

  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an accessibility issue. Reports like yours help make this project usable by everyone.

        Please share as much as you're comfortable with. Partial reports are still useful. If you use assistive technology, describe what you experienced in your own words.

  - type: markdown
    attributes:
      value: |
        Before you continue, please go over the [README](https://github.com/MathiasSM/hakyll-site/blob/master/README.md) for general usage, the [CHANGELOG](https://github.com/MathiasSM/hakyll-site/blob/master/CHANGELOG.md) to be aware of the latest changes, and the [CONTRIBUTING](https://github.com/MathiasSM/hakyll-site/blob/master/CONTRIBUTING.md) guide if you intend to help beyond reporting.

  - type: checkboxes
    id: existing
    attributes:
      label: Related Issues & PRs
      description: |
        Please search to make sure this hasn't been reported already.
      options:
        - label: I have searched existing Issues and this is a new accessibility report
          required: true
        - label: I have searched existing PRs and this is a new accessibility report
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A brief description of the accessibility barrier you encountered.
      placeholder: "Example: The skip-to-content link has no visible focus indicator."
    validations:
      required: true

  - type: textarea
    id: demo
    attributes:
      label: Demo, screenshot or video
      description: Upload or link to a demo, screenshot, or video that shows the issue. You can drag and drop or paste files here.
    validations:
      required: false

  - type: input
    id: page-url
    attributes:
      label: Page URL
      description: The URL of the page where you encountered the issue.
      placeholder: "https://mathiassm.dev/..."
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: "I expected the focus indicator to be visible when I tabbed to the link."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
      placeholder: "There was no visible focus indicator, and my screen reader did not announce the link."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        How can we reproduce the issue? A screen recording or screenshot is optional but very helpful.
      placeholder: |
        1. Go to ...
        2. Press Tab to move focus to the first interactive element.
        3. Observe that ...
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How much does this affect your ability to use the site? A maintainer will confirm or adjust this during triage.
      options:
        - Critical
        - Serious
        - Moderate
        - Minor
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "macOS 14.5, Windows 11, iOS 17, Android 14, Ubuntu 22.04"
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 124, Firefox 125, Safari 17.4, Edge 124"
    validations:
      required: false

  - type: input
    id: assistive-tech
    attributes:
      label: Assistive technology and version
      description: If you used assistive technology, please tell us which one(s) and version(s).
      placeholder: "VoiceOver (macOS 14.5), NVDA 2024.1, JAWS 2024, TalkBack on Android 14"
    validations:
      required: false

  - type: input
    id: wcag
    attributes:
      label: Related WCAG criteria (optional)
      description: |
        If you know which [WCAG](https://www.w3.org/TR/WCAG22/) success criteria this relates to, please share. Don't worry if you're not sure - we'll figure it out during triage.
      placeholder: "2.4.7 Focus Visible, 1.4.3 Contrast (Minimum)"
    validations:
      required: false

  - type: textarea
    id: code-sample
    attributes:
      label: Code sample (optional)
      description: Provide a relevant code or template snippet if possible.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else we should know? Related issues, workarounds you've tried, or other details.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/MathiasSM/hakyll-site/blob/master/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
