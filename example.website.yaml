# Example site configuration. Copy this file to `content/website.yaml` and adjust.
#
# This is the source of truth for the site's identity and the data behind the
# generated static files (funding.json, security.txt, robots.txt, ...).
# Build-time environment variables only override the `site:` section; see
# `.env.example`.

# The site's identity.
site:
  name: MathiasSM
  description: Software Development Engineer
  author: Mathias San Miguel
  copyrightYear: "2013"
  domain: mathiassm.dev
  twitterHandle: mathiassm

# How to reach the site owner.
contact:
  email: you@example.com
  page: /contact

# Web app manifest colours.
manifest:
  backgroundColor: "#fff"
  themeColor: "hsl(210, 75%, 50%)"

# MathJax CDN version used to render math on pages that use it. Required.
mathjax:
  version: "4.1.3"

# security.txt, including how far in advance the expiration must be renewed.
security:
  preferredLanguages: en, es
  expires: "2027-12-31T22:59:00.000Z"
  expirationMarginDays: 90

# robots.txt disallow rules.
robots:
  disallow: [/example, /404.html]

# trust.txt: whether the site content may be used for AI training.
trust:
  trainingAllowed: "no"

# funding.json manifest.
funding:
  entity:
    email: you@example.com
    description: "A short description of who is being funded."
  projects:
    - guid: example-project
      name: "Example project"
      description: "What this project is."
      repositoryUrl: "https://github.com/example/example"
      repositoryWellKnown: "https://github.com/example/example/blob/master/static/.well-known/funding-manifest-urls"
      licenses: ["spdx:GPL-3.0-or-later"]
      tags: ["example"]
  channels:
    - guid: example-bank
      type: bank
      address: ""
      description: "A funding channel."
  plans:
    - guid: custom-eur
      status: active
      name: "Single Payment"
      description: "A funding plan."
      amount: 0
      currency: EUR
      frequency: one-time
      channels: ["example-bank"]
