<label class="ruby-toggle">
  <input type="checkbox" checked />
  <span>ruby (content)</span>
</label>
<script>
(() => {
  const input = document.querySelector('.ruby-toggle input');
  if (!input) return;
  const update = () => document.documentElement.classList.toggle('no-ruby', !input.checked);
  input.addEventListener('change', update);
})();
</script>
